<!DOCTYPE html>
<html>
<head>
    <title>Archi-hub Commission Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; display: flex; justify-content: center; }
        .calculator { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; font-size: 14px;}
        input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; box-sizing: border-box; background-color: #f8fafc; }
        input[type="number"]:focus, select:focus { outline: none; border-color: #3b82f6; background-color: #fff; }
        .results { margin-top: 30px; padding: 25px 20px; background-color: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; text-align: center; }
        .results h3 { margin: 0; color: #0369a1; font-size: 26px; }
        .results p { margin: 10px 0 0; color: #0284c7; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Archi-hub Commission Calculator</h2>
    
    <div class="form-group">
        <label for="projectSum">Project Sum (Ksh)</label>
        <input type="number" id="projectSum" value="1000000" oninput="calculate()">
    </div>

    <div class="form-group">
        <label for="scope">Scope of Work</label>
        <select id="scope" onchange="calculate()">
            <option value="0.03">Design Only (3.0%)</option>
            <option value="0.02">Project Management (2.0%)</option>
            <option value="0.015">Repairs & Renovations (1.5%)</option>
            <option value="0.0125">Design & Construction (1.25%)</option>
            <option value="0.01">Construction Only (1.0%)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="duration">Project Duration</label>
        <select id="duration" onchange="calculate()">
            <option value="1.0">Under 1 Month (100% of Base)</option>
            <option value="0.8">1 to 3 Months (80% of Base)</option>
            <option value="0.6">3 to 6 Months (60% of Base)</option>
            <option value="0.4">Over 6 Months (40% of Base)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="referrals">Previous Referrals</label>
        <select id="referrals" onchange="calculate()">
            <option value="0">0 Previous (+0.0%)</option>
            <option value="0.0025">1 to 3 Previous (+0.25%)</option>
            <option value="0.005">4+ Previous (+0.50%)</option>
        </select>
    </div>

    <div class="results">
        <h3 id="totalPayout">Payout: Ksh 30,000.00</h3>
        <p id="finalRate">Final Rate: 3.00%</p>
    </div>
</div>

</body>
</html>
